<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scaeli Daily</title>
<meta name="description" content="Scaeli Daily — rezar todos los días. El Evangelio, el Rosario, las Horas, el examen del día y tu semana con Dios.">
<meta name="theme-color" content="#0C0D10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scaeli Daily">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="wrap" id="app"></div>

<nav class="nav" id="nav" aria-label="Secciones" hidden><div class="in">
  <button data-view="hoy" aria-label="Hoy"><svg class="i"><use href="#i-today"/></svg><span>Hoy</span></button>
  <button data-view="rezar" aria-label="Rezar"><svg class="i"><use href="#i-cross"/></svg><span>Rezar</span></button>
  <button data-view="dia" aria-label="Día"><svg class="i"><use href="#i-check"/></svg><span>Día</span></button>
  <button data-view="yo" aria-label="Yo"><svg class="i"><use href="#i-user"/></svg><span>Yo</span></button>
  <button data-view="mas" aria-label="Más"><svg class="i"><use href="#i-more"/></svg><span>Más</span></button>
</div></nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast" hidden></div>
